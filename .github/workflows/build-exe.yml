name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --console --name txt2pdf --collect-data reportlab txt2pdf.py

      - name: Smoke test
        shell: bash
        run: |
          mkdir -p smoke
          printf 'Hello from CI\nUnicode: café ✓\n' > smoke/test.txt
          ./dist/txt2pdf.exe smoke --overwrite
          test -s smoke/test.pdf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: txt2pdf-windows
          path: dist/txt2pdf.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/txt2pdf.exe
          generate_release_notes: true
